; Configuration PHP pour LWS
; Placé dans public/ pour être lu par le serveur web

; Limites
memory_limit = 256M
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 120

; Extensions requises par Laravel
extension=pdo_mysql
extension=mbstring
extension=openssl
extension=tokenizer
extension=xml
extension=ctype
extension=json
extension=bcmath
extension=fileinfo

; Session
session.gc_maxlifetime = 7200
